name: Backend CI

on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Tests and code style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run unit tests with coverage
        id: coverage
        run: npm run test:cov

      - name: Publish coverage summary
        if: ${{ !cancelled() && hashFiles('backend/coverage/coverage-summary.json') != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { total } = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          const rows = ['lines', 'branches', 'functions', 'statements'].map((key) => {
            const metric = total[key];
            return `| ${key} | ${metric.pct}% | ${metric.covered} / ${metric.total} |`;
          });
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Backend unit test coverage',
            '',
            '| Metric | Coverage | Covered / Total |',
            '| --- | ---: | ---: |',
            ...rows,
            '',
            'Includes backend source files not reached by unit tests. E2E coverage is not included.',
            'Download the backend-coverage artifact and open index.html for per-file details.',
            'Coverage is informational; no minimum threshold is enforced.',
            '',
          ].join('\n'));
          NODE

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('backend/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Run E2E tests
        run: npm run test:e2e

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build backend
        run: npm run build
