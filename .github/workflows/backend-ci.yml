name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  result:
    name: Backend CI result
    if: ${{ always() }}
    needs: [test, coverage, security, build, mutation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Report required checks and fail on errors
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const results = JSON.parse(process.env.REQUIRED_RESULTS);
          const names = {
            test: 'Tests and code style',
            coverage: 'Code coverage',
            security: 'Security - Trivy',
            build: 'Typecheck and build',
            mutation: 'Mutation testing pilot',
          };
          const failed = Object.keys(names).filter(key => results[key]?.result !== 'success');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Backend CI result', '',
            failed.length ? '**FAILED — merge is blocked when this check is required.**' : '**PASSED**', '',
            '| Check | Result |', '| --- | --- |',
            ...Object.entries(names).map(([key, name]) => `| ${name} | ${results[key]?.result ?? 'missing'} |`), '',
            `[Open workflow logs to inspect the failed job and step](${process.env.RUN_URL})`, '',
          ].join('\n'));
          if (failed.length) {
            console.error(`::error title=Backend CI failed::Required checks failed or did not complete: ${failed.map(key => names[key]).join(', ')}. Open the failed job logs for details.`);
            process.exitCode = 1;
          }
          NODE

  test:
    name: Tests and code style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        id: coverage
        run: npm run test:cov

      - name: Publish coverage summary
        if: ${{ !cancelled() && hashFiles('backend/coverage/coverage-summary.json') != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { total } = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          const rows = ['lines', 'branches', 'functions', 'statements'].map((key) => {
            const metric = total[key];
            return `| ${key} | ${metric.pct}% | ${metric.covered} / ${metric.total} |`;
          });
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Backend unit test coverage',
            '',
            '| Metric | Coverage | Covered / Total |',
            '| --- | ---: | ---: |',
            ...rows,
            '',
            'Covers the unit and integration test suite, including source files not reached by tests.',
            'Download the backend-coverage artifact and open index.html for per-file details.',
            'Coverage is informational; no minimum threshold is enforced.',
            '',
          ].join('\n'));
          NODE

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('backend/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: error
          retention-days: 14

  security:
    name: Security - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test security report sanitization and policy
        run: node --test .github/scripts/trivy-report.test.mjs

      - name: Scan repository with Trivy
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: 'false'
          format: json
          output: ${{ runner.temp }}/trivy-raw.json
          # The reporting step enforces the policy after safely publishing findings.
          exit-code: '0'
          hide-progress: 'true'
          timeout: 10m
          cache-dir: ${{ runner.temp }}/trivy-cache
          skip-dirs: .git,node_modules,backend/node_modules,backend/dist,backend/coverage,backend/tmp

      - name: Publish sanitized security summary and enforce policy
        id: security_report
        if: ${{ !cancelled() && steps.trivy.outcome != 'skipped' }}
        env:
          TRIVY_RAW_REPORT: ${{ runner.temp }}/trivy-raw.json
          TRIVY_SAFE_REPORT: ${{ runner.temp }}/trivy-safe/report.json
        run: node .github/scripts/trivy-report.mjs

      - name: Upload sanitized security report
        if: ${{ !cancelled() && steps.security_report.outputs.report-ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-security-report
          path: ${{ runner.temp }}/trivy-safe/report.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build backend
        run: npm run build

  mutation:
    name: Mutation testing pilot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run mutation testing pilot
        run: npm run test:mutation

      - name: Publish mutation summary
        if: ${{ !cancelled() && hashFiles('backend/reports/mutation/mutation.json') != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('reports/mutation/mutation.json', 'utf8'));
          const statuses = ['Killed', 'Survived', 'NoCoverage', 'Timeout', 'CompileError', 'RuntimeError', 'Ignored'];
          const counts = Object.fromEntries(statuses.map(status => [status, 0]));
          for (const file of Object.values(report.files)) {
            for (const mutant of file.mutants) counts[mutant.status] = (counts[mutant.status] ?? 0) + 1;
          }
          const detected = counts.Killed + counts.Timeout;
          const valid = detected + counts.Survived + counts.NoCoverage;
          const score = valid ? `${(detected / valid * 100).toFixed(2)}%` : 'N/A';
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Backend mutation testing pilot', '',
            `**Mutation score: ${score}**`, '',
            '| Status | Mutants |', '| --- | ---: |',
            ...statuses.map(status => `| ${status} | ${counts[status]} |`), '',
            'Scope: JWT verification and request logging middleware only.',
            'Score = (Killed + Timeout) / (Killed + Timeout + Survived + NoCoverage).',
            'Survivors need review; some mutations may preserve observable behavior.',
            'No score threshold is enforced. Baseline or runner failures still fail the job.',
            'Download backend-mutation-report and open index.html to inspect each mutation.', '',
          ].join('\n'));
          NODE

      - name: Upload mutation report
        if: ${{ !cancelled() && hashFiles('backend/reports/mutation/mutation.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-mutation-report
          path: backend/reports/mutation/
          if-no-files-found: error
          retention-days: 14
